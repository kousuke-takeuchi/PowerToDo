[package]
name = "powertodo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "powertodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.36", features = ["dates"] }
rust_xlsxwriter = { version = "0.99", features = ["chrono"] }
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.6"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "net", "io-util", "macros"] }
unicode-normalization = "0.1"
notify = "8.2"
rrule = "0.14"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
# reqwest ships its TLS without a crypto provider; `rustls` below supplies `ring` (installed by
# `sync::tls::install_crypto_provider`). The default `rustls` feature would pull aws-lc-sys, a C
# build that needs extra tooling on Windows. `socks` is for the tailnet proxy.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = "0.42"
percent-encoding = "2.3"
url = "2.5"
tauri-plugin-powertodo-ios = { path = "plugins/ios" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }
wiremock = "0.6"
# `tauri::test` (a mock app) drives the updater plugin in `commands::update` tests.
tauri = { version = "2", features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14"
keyring = { version = "4.2", features = ["v1"] }

# iOS: the node's state folder is excluded from backup (`sync::tailnet_inproc::exclude_from_backup`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# Scheduled reminders: `Schedule::At` takes a `time::OffsetDateTime` (same 0.3 the notification plugin uses).
time = "0.3"
objc2-foundation = "0.3"
# iOS keychain (`sync::secrets::AppleStore`): keyring 4.2 `v1` does not build for iOS, whose
# apple-native-keyring-store needs `protected` there.
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }
