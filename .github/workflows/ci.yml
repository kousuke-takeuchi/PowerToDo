name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run check:stories

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - run: go test ./...
        working-directory: tailnet
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      # tauri-build checks that bundle.externalBin exists, so build the sidecar first (needs rustc for the host triple).
      - run: npm run build:tailnet
      # CI has no Google OAuth json (no secret, on purpose): the build runs without Drive, and nothing here may
      # use `-v` / `-vv`. If a job ever gets the json, do not cache or upload target/ from it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      # The iOS target must keep compiling (desktop-only code sits behind cfg(desktop)).
      - name: Add the iOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios
      - name: Check the iOS target
        if: runner.os == 'macOS'
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib
